<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A chat assistant confirming ADA compliance with a checkmark">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6FE0"/>
      <stop offset="1" stop-color="#12B886"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <circle cx="330" cy="70" r="110" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="60" cy="250" r="80" fill="#0B3E8C" opacity="0.18"/>
  <!-- small assistant bubble -->
  <g>
    <rect x="60" y="70" width="120" height="70" rx="18" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="92" cy="105" r="6" fill="#FFFFFF"/>
    <circle cx="118" cy="105" r="6" fill="#FFFFFF"/>
    <circle cx="144" cy="105" r="6" fill="#FFFFFF"/>
  </g>
  <!-- main answer bubble with check -->
  <g>
    <rect x="120" y="120" width="200" height="130" rx="26" fill="url(#bubble)"/>
    <polygon points="150,250 150,284 186,250" fill="#EAF2FF"/>
    <circle cx="220" cy="185" r="46" fill="#12B886"/>
    <path d="M198 187 l15 16 l30 -36" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- sparkles -->
  <g fill="#FFB020">
    <path d="M320 150 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <circle cx="300" cy="120" r="5"/>
  </g>
</svg>
