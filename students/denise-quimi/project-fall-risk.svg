<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="An AI map of a floor plan highlighting fall-risk zones">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A57"/>
      <stop offset="1" stop-color="#1E6FE0"/>
    </linearGradient>
    <radialGradient id="risk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A5A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF5A5A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <!-- plan grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1">
    <line x1="40" y1="50" x2="40" y2="250"/><line x1="100" y1="50" x2="100" y2="250"/>
    <line x1="160" y1="50" x2="160" y2="250"/><line x1="220" y1="50" x2="220" y2="250"/>
    <line x1="280" y1="50" x2="280" y2="250"/><line x1="340" y1="50" x2="340" y2="250"/>
    <line x1="40" y1="50" x2="340" y2="50"/><line x1="40" y1="110" x2="340" y2="110"/>
    <line x1="40" y1="170" x2="340" y2="170"/><line x1="40" y1="230" x2="340" y2="230"/>
  </g>
  <!-- plan outline -->
  <rect x="40" y="50" width="300" height="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" rx="4"/>
  <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M150 50 V120 H40"/>
    <path d="M240 250 V150 H340"/>
  </g>
  <!-- risk glows -->
  <circle cx="105" cy="90" r="46" fill="url(#risk)"/>
  <circle cx="205" cy="205" r="52" fill="url(#risk)"/>
  <!-- AI node network -->
  <g stroke="#7DE2FF" stroke-width="2" opacity="0.9">
    <line x1="105" y1="90" x2="180" y2="140"/>
    <line x1="180" y1="140" x2="205" y2="205"/>
    <line x1="180" y1="140" x2="280" y2="110"/>
    <line x1="205" y1="205" x2="285" y2="200"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="105" cy="90" r="7"/>
    <circle cx="180" cy="140" r="9"/>
    <circle cx="205" cy="205" r="7"/>
    <circle cx="280" cy="110" r="6"/>
    <circle cx="285" cy="200" r="6"/>
  </g>
  <g fill="#FFB020">
    <circle cx="105" cy="90" r="3.5"/>
    <circle cx="205" cy="205" r="3.5"/>
  </g>
</svg>
