<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stacked documents turning into an organized checklist, representing an AI regulatory affairs assistant">
  <rect x="0" y="0" width="400" height="225" fill="#FBF8F2"/>

  <g>
    <rect x="55" y="70" width="90" height="110" rx="6" fill="#fff" stroke="#0F6E6E" stroke-width="2"/>
    <rect x="65" y="58" width="90" height="110" rx="6" fill="#fff" stroke="#0F6E6E" stroke-width="2"/>
    <rect x="75" y="46" width="90" height="110" rx="6" fill="#fff" stroke="#0F6E6E" stroke-width="2.5"/>
    <g stroke="#B9CFCE" stroke-width="3">
      <line x1="90" y1="66" x2="150" y2="66"/>
      <line x1="90" y1="82" x2="150" y2="82"/>
      <line x1="90" y1="98" x2="130" y2="98"/>
      <line x1="90" y1="114" x2="150" y2="114"/>
      <line x1="90" y1="130" x2="140" y2="130"/>
    </g>
  </g>

  <path d="M195,110 H240" stroke="#C9A227" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#C9A227"/>
    </marker>
  </defs>

  <rect x="255" y="55" width="100" height="120" rx="10" fill="#fff" stroke="#0F6E6E" stroke-width="2.5"/>
  <g stroke="#0F6E6E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270,80 L277,87 L290,72"/>
    <path d="M270,110 L277,117 L290,102"/>
    <path d="M270,140 L277,147 L290,132"/>
  </g>
  <g stroke="#B9CFCE" stroke-width="3">
    <line x1="300" y1="83" x2="340" y2="83"/>
    <line x1="300" y1="113" x2="340" y2="113"/>
    <line x1="300" y1="143" x2="340" y2="143"/>
  </g>
</svg>
