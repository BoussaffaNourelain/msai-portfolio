<svg width="800" height="450" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a35"/>
      <stop offset="100%" stop-color="#2f4356"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7fa8a3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7fa8a3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="675" fill="url(#glow)"/>

  <g transform="rotate(-0.6 600 337)">
    <!-- dashboard card -->
    <rect x="330" y="140" width="540" height="380" rx="18" fill="#26343f" stroke="#7fa8a3" stroke-width="2"/>

    <!-- calendar grid -->
    <rect x="360" y="175" width="220" height="170" rx="10" fill="#2f4356"/>
    <line x1="360" y1="210" x2="580" y2="210" stroke="#d8c9a3" stroke-width="2" opacity="0.6"/>
    <g fill="#d8c9a3" opacity="0.8">
      <circle cx="390" cy="235" r="7"/>
      <circle cx="430" cy="235" r="7"/>
      <circle cx="470" cy="235" r="7"/>
      <circle cx="510" cy="235" r="7"/>
      <circle cx="550" cy="235" r="7"/>
      <circle cx="390" cy="270" r="7"/>
      <circle cx="430" cy="270" r="7"/>
      <circle cx="470" cy="270" r="7" fill="#c98a7d"/>
      <circle cx="510" cy="270" r="7"/>
      <circle cx="550" cy="270" r="7"/>
      <circle cx="390" cy="305" r="7"/>
      <circle cx="430" cy="305" r="7"/>
      <circle cx="470" cy="305" r="7"/>
      <circle cx="510" cy="305" r="7"/>
      <circle cx="550" cy="305" r="7"/>
    </g>

    <!-- checklist -->
    <rect x="610" y="175" width="230" height="170" rx="10" fill="#2f4356"/>
    <g stroke="#7fa8a3" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M632 205 l8 8 l16 -16"/>
      <path d="M632 245 l8 8 l16 -16"/>
      <path d="M632 285 l8 8 l16 -16"/>
    </g>
    <g fill="#d8c9a3" opacity="0.75">
      <rect x="670" y="200" width="150" height="12" rx="6"/>
      <rect x="670" y="240" width="120" height="12" rx="6"/>
      <rect x="670" y="280" width="140" height="12" rx="6"/>
    </g>

    <!-- people group (abstract, no faces) -->
    <g>
      <ellipse cx="410" cy="440" rx="26" ry="30" fill="#c98a7d"/>
      <rect x="384" y="465" width="52" height="55" rx="18" fill="#c98a7d"/>

      <ellipse cx="490" cy="430" rx="24" ry="28" fill="#d8c9a3"/>
      <rect x="466" y="453" width="48" height="60" rx="18" fill="#d8c9a3"/>

      <ellipse cx="570" cy="435" rx="25" ry="29" fill="#7fa8a3"/>
      <rect x="545" y="459" width="50" height="57" rx="18" fill="#7fa8a3"/>
    </g>

    <!-- progress bar -->
    <rect x="360" y="380" width="480" height="16" rx="8" fill="#2f4356"/>
    <rect x="360" y="380" width="330" height="16" rx="8" fill="#7fa8a3"/>
